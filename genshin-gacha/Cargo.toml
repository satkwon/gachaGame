[package]
name = "genshin-gacha"
version = "0.1.0"
edition = "2021"
description = "A terminal gacha / wish simulator with Genshin-accurate odds and Ghostty image reveals"

[[bin]]
name = "wish"
path = "src/main.rs"

[dependencies]
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
crossterm = "0.27"
base64 = "0.22"
dirs = "5"

[profile.release]
opt-level = 3
lto = true
